name: Publicar versão

# Gera os instaladores de Windows, Mac e Linux, anexa à versão no GitHub e
# publica como a mais recente, com as novidades tiradas do CHANGELOG.md. A
# versão fica como rascunho enquanto os instaladores são gerados: se algum
# sistema falhar, ela não é publicada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Um rascunho só, criado antes dos instaladores: se cada sistema criasse o
  # seu ao mesmo tempo, a versão ficaria dividida em dois rascunhos.
  rascunho:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.criar.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: criar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(node -p "require('./package.json').version")
          # Publicar o rascunho cria a etiqueta, e a etiqueta dispara este
          # fluxo de novo: se a versão já está publicada, não há o que gerar.
          publicada=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$versao\" and (.draft | not)) | .id" | head -n1)
          if [ -n "$publicada" ]; then
            echo "A versão v$versao já está publicada; nada a fazer."
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$versao\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$versao" -f target_commitish="$GITHUB_SHA" \
              -f name="4Nier Patrimônio Auditável $versao" \
              -f body="O que mudou: veja o CHANGELOG.md. Windows: arquivo -setup.exe. Mac: arquivo .dmg (na primeira vez, botão direito › Abrir). Linux: .deb ou .AppImage." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  instaladores:
    needs: rascunho
    if: needs.rascunho.outputs.id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
          - os: macos-latest
            # "app" gera o pacote de atualização do Mac (.app.tar.gz); sem ele o
            # latest.json fica sem o Mac e o "Atualizar agora" não aparece lá.
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os pacotes de atualização ("Atualizar agora" no app). A
          # chave pública correspondente está em tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.rascunho.outputs.id }}
          # Só aqui são gerados os pacotes de atualização e o latest.json; os
          # instaladores de teste do CI e o pacote da loja não precisam deles.
          args: ${{ matrix.args }} --config src-tauri/tauri.atualizacao.conf.json
          includeUpdaterJson: true

  publicar:
    needs: [rascunho, instaladores]
    if: needs.rascunho.outputs.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(node -p "require('./package.json').version")
          # A seção desta versão no CHANGELOG, sem o título.
          awk -v v="$versao" '
            /^## \[/ { dentro = index($0, "[" v "]") > 0; next }
            dentro' CHANGELOG.md > notas.md
          {
            echo
            echo "## Como instalar"
            echo
            echo "- Windows: baixe o arquivo que termina em -setup.exe."
            echo "- Mac: baixe o .dmg (na primeira vez, botão direito › Abrir)."
            echo "- Linux: .deb ou .AppImage."
          } >> notas.md
          jq -n --rawfile body notas.md '{draft: false, make_latest: "true", body: $body}' \
            | gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.rascunho.outputs.id }}" --input - --jq .html_url
