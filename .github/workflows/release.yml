name: Publicar versão

# Ao criar uma etiqueta (tag) v*, gera os instaladores de Windows, Mac e
# Linux e os anexa a um rascunho de versão no GitHub. O rascunho só fica
# visível depois de publicado à mão na página Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Um rascunho só, criado antes dos instaladores: se cada sistema criasse o
  # seu ao mesmo tempo, a versão ficaria dividida em dois rascunhos.
  rascunho:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.criar.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: criar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versao=$(node -p "require('./package.json').version")
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v$versao\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$versao" -f target_commitish="$GITHUB_SHA" \
              -f name="4Nier Patrimônio Auditável $versao" \
              -f body="O que mudou: veja o CHANGELOG.md. Windows: arquivo -setup.exe. Mac: arquivo .dmg (na primeira vez, botão direito › Abrir). Linux: .deb ou .AppImage." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  instaladores:
    needs: rascunho
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.rascunho.outputs.id }}
          args: ${{ matrix.args }}
