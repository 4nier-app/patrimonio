name: Pacote da Microsoft Store

# Gera o .msix para enviar no Partner Center. A loja assina o pacote, então
# não há certificado aqui. Rode em Actions › "Pacote da Microsoft Store".
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "loja/**"
      - ".github/workflows/loja.yml"

jobs:
  msix:
    name: Pacote MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Gerar o aplicativo (versão da loja, sem aviso de nova versão)
        env:
          CARTEIRA_LOJA: "1"
        run: npx tauri build --no-bundle
      - name: Montar e empacotar
        shell: pwsh
        run: |
          $versao = (Get-Content package.json | ConvertFrom-Json).version
          # A loja exige quatro partes, com a última zero.
          $v4 = "$versao.0"
          $pasta = "loja-pacote"
          New-Item -ItemType Directory -Force "$pasta/Assets" | Out-Null
          Copy-Item target/release/carteira-app.exe "$pasta/4Nier.exe"
          foreach ($icone in "StoreLogo", "Square44x44Logo", "Square150x150Logo", "Square310x310Logo") {
            Copy-Item "src-tauri/icons/$icone.png" "$pasta/Assets/$icone.png"
          }
          (Get-Content loja/AppxManifest.xml -Raw).Replace("__VERSAO__", $v4) |
            Set-Content -Encoding utf8 "$pasta/AppxManifest.xml"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d $pasta /p "4Nier-Patrimonio-$versao.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-microsoft-store
          path: "*.msix"
          if-no-files-found: error
          retention-days: 30
