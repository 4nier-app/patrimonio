name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Privacidade (nenhuma nota real no repositório)
        run: npm run check:privacidade
      - run: npm test
      - run: npm run build
      - name: Testes Rust
        run: cargo test --workspace --locked

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Testes Rust no Windows
        run: cargo test --workspace --locked
      - name: Gerar instalador
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Instalador Linux
    runs-on: ubuntu-24.04
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Gerar instaladores (AppImage e .deb)
        run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  mac:
    name: Instalador Mac
    # O Mac gasta os minutos grátis 10 vezes mais rápido em repositório
    # privado: só roda quando pedido à mão ou com o repositório público.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: macos-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Gerar instalador (Intel e Apple Silicon)
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-mac
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
