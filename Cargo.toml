[workspace]
resolver = "2"
members = ["crates/core", "crates/ledger", "crates/providers", "crates/storage", "src-tauri"]

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/marcelo-fournier/carteira-auditavel"
rust-version = "1.90"

[workspace.dependencies]
rust_decimal = { version = "1.43", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
