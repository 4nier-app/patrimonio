[package]
name = "carteira-app"
description = "Carteira Auditável: aplicativo desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "carteira_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
carteira-core = { path = "../crates/core" }
carteira-ledger = { path = "../crates/ledger" }
carteira-providers = { path = "../crates/providers" }
carteira-storage = { path = "../crates/storage" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
rust_decimal_macros.workspace = true
